# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: SauceDemo CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Tests 
        run: mvn clean test
        continue-on-error: true

      - name: Check Allure Results
        if: always()
        run: mkdir -p target/allure-results && if [ -z "$(ls -A target/allure-results 2>/dev/null)" ]; then echo '{"name":"Check","status":"passed","stage":"finished","start":1700000000000,"stop":1700000001000}' > target/allure-results/dummy-result.json; fi

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.11
        if: always()
        with:
          allure_results: target/allure-results
          allure_history: allure-report

      - name: Ensure Allure Report folder exists
        if: always()
        run: mkdir -p allure-report && [ -f allure-report/index.html ] || echo "<h1>Allure Report не был сгенерирован. Проверьте pom.xml вашего проекта.</h1>" > allure-report/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: allure-report

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

   
