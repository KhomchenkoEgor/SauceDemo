# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: SauceDemo CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run Tests 
        run: mvn clean test
        continue-on-error: true

     # Шаг 2: Генерация красивого HTML-отчета силами самого Maven (создает папку target/site/allure-maven-plugin)
      - name: Generate Allure Report via Maven
        if: always()
        run: mvn allure:report

      # Шаг 3: Архивируем сгенерированную Maven-папку для деплоя
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: target/site/allure-maven-plugin

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success() || always()
    environment:
      name: github-pages
    steps:
      # Шаг 4: Официальный деплой на серверы GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
   
