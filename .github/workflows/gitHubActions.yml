# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: SauceDemo CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: mvn clean test

        continue-on-error: true

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always() # Выполнять шаг всегда, даже если тесты упали
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.9
        if: always()
        with:
          allure_results: target/allure-results
          allure_history: allure-report

      # ОФИЦИАЛЬНЫЙ ШАГ 1: Архивация готового отчета для GitHub Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: allure-report  # Указываем папку, где лежит index.html отчета

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      # ОФИЦИАЛЬНЫЙ ШАГ 2: Публикация на сайт без использования Git-коммитов
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

   
